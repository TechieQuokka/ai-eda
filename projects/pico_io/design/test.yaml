tests:
  led_on:
    description: With the LED pin high, the LED runs at about 8 mA (GPIO drive limit 12 mA).
    analysis: { type: op }
    pins: { LED: high }
    expect:
      - { measure: current(D1), min: 6mA, max: 10mA }
      - { measure: current(U1.GP15), min: -12mA, max: 0mA }
  led_off:
    description: With the LED pin low, the LED is dark.
    analysis: { type: op }
    pins: { LED: low }
    expect:
      - { measure: current(D1), max: 10uA }
  button_idle:
    description: The internal pull-up holds BUTTON high while the switch is open.
    analysis: { type: op }
    expect:
      - { measure: voltage(BUTTON), min: 3.2V }
  pot_midscale:
    description: The wiper at 50 % puts half of 3.3 V on ADC0.
    analysis: { type: op }
    expect:
      - { measure: voltage(POT), min: 1.6V, max: 1.7V }
  uart_idle:
    description: UART TX idles high.
    analysis: { type: op }
    expect:
      - { measure: voltage(UART_TX), min: 3.2V }
  firmware_blink:
    description: >
      Firmware in the loop. With the button released (read through the circuit and the
      internal pull-up) the LED toggles every 500 ms, and the firmware prints the ADC
      reading of the potentiometer (mid-scale, about 2048 of 4095) on the UART.
    analysis: { type: tran, step: 1ms, stop: 2.2s }
    firmware: true
    expect:
      - { measure: max(current(D1)), min: 5mA, max: 10mA }
      - { measure: "at(current(D1), 700ms)", max: 10uA }
      - { measure: "period(current(D1), 3mA)", min: 0.95s, max: 1.05s }
      - { serial: UART_TX, match: 'pot=(\d+)', min: 1950, max: 2150 }
  firmware_button:
    description: >
      Firmware in the loop with the button held and the potentiometer at a quarter: the
      firmware reads BUTTON low through the switch and blinks five times faster (toggle
      every 100 ms, period 200 ms), and reports about a quarter of full scale (~1024).
    analysis: { type: tran, step: 1ms, stop: 1.2s }
    firmware: true
    parts:
      SW1: { state: pressed }
      RV1: { position: 25% }
    expect:
      - { measure: "period(current(D1), 3mA)", min: 190ms, max: 210ms }
      - { measure: max(voltage(BUTTON)), max: 0.1V }
      - { serial: UART_TX, match: 'pot=(\d+)', min: 950, max: 1100 }
      - { serial: UART_TX, match: 'pot=', min: 10 }
  firmware_press:
    description: >
      The button is pressed at 1.1 s while the firmware runs: before, the LED blinks with
      a 1 s period; once the firmware sees the press, with a 200 ms period.
    analysis: { type: tran, step: 1ms, stop: 2.4s }
    firmware: true
    events:
      - { at: 1.1s, part: SW1, set: { state: pressed } }
    expect:
      - { measure: "period(current(D1), 3mA)", to: 1.05s, min: 0.95s, max: 1.05s }
      - { measure: "period(current(D1), 3mA)", from: 1.6s, min: 190ms, max: 210ms }
      - { measure: "at(voltage(BUTTON), 1s)", min: 3.2V }
      - { measure: "at(voltage(BUTTON), 1.2s)", max: 0.1V }
  firmware_command:
    description: >
      "rate 100" sent to the firmware's UART at 300 ms makes it toggle every 100 ms; it
      confirms with "rate=100". A bad command is reported.
    analysis: { type: tran, step: 1ms, stop: 1.6s }
    firmware: true
    events:
      - { at: 300ms, serial: UART_RX, send: "rate 100\n" }
      - { at: 400ms, serial: UART_RX, send: "speed up\n" }
    expect:
      - { measure: "period(current(D1), 3mA)", from: 700ms, min: 190ms, max: 210ms }
      - { serial: UART_TX, match: 'rate=(\d+)', min: 100, max: 100 }
      - { serial: UART_TX, match: 'error: speed up', min: 1, max: 1 }
