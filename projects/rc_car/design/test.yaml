# Requirements of the RC car, one test each. Commands come as the remote sends them:
# a line every 50 ms (`every`), "D,<throttle>,<steer>".
tests:
  power:
    description: Fresh cells, standing still. The 5 V rail and the Pico's supply are in range.
    analysis: { type: op }
    expect:
      - { measure: voltage(V5), min: 4.95V, max: 5.05V }
      - { measure: voltage(VSYS), min: 4.5V, max: 5.0V }
      - { measure: current(BT1), min: -100mA, max: 0A }

  forward:
    description: Full throttle ahead. The motor gets the whole battery, starting through the ramp.
    analysis: { type: tran, step: 50us, stop: 1.2s }
    firmware: true
    events:
      - { at: 100ms, serial: UART_RX, send: "D,100,0\n", every: 50ms }
    expect:
      - { serial: UART_TX, match: "ready", min: 1, max: 1 }
      - { measure: "avg(voltage(MOT_A, MOT_B))", from: 0.9s, min: 5.4V, max: 6V }
      - { measure: "avg(current(M1))", from: 0.9s, min: 0.15A, max: 0.3A }
      - { measure: max(current(M1)), max: 1.5A }
      - { measure: "width(voltage(SERVO), 1.65V)", from: 0.2s, min: 1.46ms, max: 1.54ms }

  half_reverse:
    description: Half throttle backwards.
    analysis: { type: tran, step: 50us, stop: 1.2s }
    firmware: true
    events:
      - { at: 100ms, serial: UART_RX, send: "D,-50,0\n", every: 50ms }
    expect:
      - { measure: "avg(voltage(MOT_A, MOT_B))", from: 0.9s, min: -3.2V, max: -2.7V }
      - { measure: "avg(current(M1))", from: 0.9s, min: -0.3A, max: -0.15A }

  steering:
    description: Full left, then full right, then straight; the servo pulses every 20 ms.
    analysis: { type: tran, step: 10us, stop: 700ms }
    firmware: true
    events:
      - { at: 50ms, serial: UART_RX, send: "D,0,-100\n", every: 50ms, until: 250ms }
      - { at: 250ms, serial: UART_RX, send: "D,0,100\n", every: 50ms, until: 450ms }
      - { at: 450ms, serial: UART_RX, send: "D,0,0\n", every: 50ms }
    expect:
      - { measure: "width(voltage(SERVO), 1.65V)", from: 100ms, to: 240ms, min: 0.97ms, max: 1.03ms }
      - { measure: "width(voltage(SERVO), 1.65V)", from: 300ms, to: 440ms, min: 1.97ms, max: 2.03ms }
      - { measure: "width(voltage(SERVO), 1.65V)", from: 500ms, min: 1.47ms, max: 1.53ms }
      - { measure: "period(voltage(SERVO), 1.65V)", from: 100ms, min: 19.9ms, max: 20.1ms }

  silence:
    description: The commands stop (out of range). The car brakes to a stop and straightens.
    analysis: { type: tran, step: 50us, stop: 1.6s }
    firmware: true
    events:
      - { at: 100ms, serial: UART_RX, send: "D,100,60\n", every: 50ms, until: 700ms }
    expect:
      - { measure: "avg(voltage(MOT_A, MOT_B))", from: 500ms, to: 650ms, min: 5.4V }
      - { measure: "width(voltage(SERVO), 1.65V)", from: 500ms, to: 650ms, min: 1.77ms, max: 1.83ms }
      - { serial: UART_TX, match: "failsafe: no commands", min: 1, max: 1 }
      - { measure: "avg(voltage(MOT_A, MOT_B))", from: 1.3s, min: -10mV, max: 10mV }
      - { measure: "width(voltage(SERVO), 1.65V)", from: 1.3s, min: 1.47ms, max: 1.53ms }

  link_lost:
    description: "The Bluetooth link drops while driving: the car stops at once, though bytes might still trickle in."
    analysis: { type: tran, step: 50us, stop: 1.6s }
    firmware: true
    events:
      - { at: 100ms, serial: UART_RX, send: "D,100,0\n", every: 50ms }
      - { at: 700ms, part: U4, set: { link: waiting } }
    expect:
      - { serial: UART_TX, match: "failsafe: link down", min: 1, max: 1 }
      - { measure: "avg(voltage(MOT_A, MOT_B))", from: 1.3s, min: -10mV, max: 10mV }

  bad_commands:
    description: Garbled or out-of-range lines are ignored; the car does not move.
    analysis: { type: tran, step: 50us, stop: 600ms }
    firmware: true
    events:
      - { at: 50ms, serial: UART_RX, send: "D,500,0\n", every: 50ms, until: 300ms }
      - { at: 75ms, serial: UART_RX, send: "D,80\nX,80,0\nD,80,0,1\n", every: 50ms }
    expect:
      - { measure: "max(voltage(MOT_A, MOT_B))", max: 10mV }
      - { measure: "min(voltage(MOT_A, MOT_B))", min: -10mV }

  reversing:
    description: Full ahead, then full reverse. The car brakes to a standstill before it backs up; the motor current never exceeds its stall current or the driver's 2.4 A.
    analysis: { type: tran, step: 50us, stop: 2.4s }
    firmware: true
    events:
      - { at: 100ms, serial: UART_RX, send: "D,100,0\n", every: 50ms, until: 900ms }
      - { at: 900ms, serial: UART_RX, send: "D,-100,0\n", every: 50ms }
    expect:
      - { measure: max(current(M1)), max: 2.2A }
      - { measure: min(current(M1)), min: -2.2A }
      - { measure: "avg(voltage(MOT_A, MOT_B))", from: 2.1s, min: -6V, max: -5.4V }

  stall:
    description: >
      Wheels blocked at full throttle and the servo pushing against its stop. The cells
      deliver about 2.5 A, so their internal resistance pulls VBAT down to about 4 V and the
      motor gets less than its rated stall current; the 5 V rail holds.
    analysis: { type: tran, step: 50us, stop: 1.2s }
    firmware: true
    parts: { M1: { shaft: stalled }, S1: { load: stalled } }
    events:
      - { at: 100ms, serial: UART_RX, send: "D,100,100\n", every: 50ms }
    expect:
      - { measure: "avg(current(M1))", from: 0.9s, min: 1.2A, max: 1.6A }
      - { measure: min(voltage(VBAT)), min: 3.6V }
      - { measure: min(voltage(V5)), min: 4.75V }
      - { measure: min(voltage(VSYS)), min: 4.4V }
      - { measure: "max(current(U2.vout))", max: 1A }

  low_battery:
    description: >
      Cells nearly empty (1.05 V each). The car still drives, then stops (commands end at
      1.3 s). The battery is measured at rest (the 2 s report, after the stop), so the
      motor's load does not count; the LED blinks fast.
    analysis: { type: tran, step: 50us, stop: 2.5s }
    firmware: true
    parts: { BT1: { voltage: 4.2V, rint: 1.2ohm } }
    events:
      - { at: 100ms, serial: UART_RX, send: "D,100,0\n", every: 50ms, until: 1.3s }
    expect:
      - { serial: UART_TX, match: 'B,(\d+)', min: 3900, max: 4200 }
      - { measure: "period(current(LED1), 1mA)", from: 1.5s, min: 240ms, max: 260ms }
      - { measure: min(voltage(VSYS)), min: 4.4V }

  battery_report:
    description: Fresh cells are reported about once a second.
    analysis: { type: tran, step: 50us, stop: 2.2s }
    firmware: true
    expect:
      - { serial: UART_TX, match: 'B,(\d+)', min: 5900, max: 6000 }
      - { serial: UART_TX, match: 'B,\d+', min: 2, max: 2 }
      - { measure: "period(current(LED1), 1mA)", from: 0.5s, min: 990ms, max: 1010ms }

  reversed_cells:
    description: The battery box wired the wrong way round. Nothing conducts more than a trickle.
    analysis: { type: op }
    parts: { BT1: { voltage: -6V } }
    expect:
      - { measure: current(BT1), min: 0A, max: 1mA }
