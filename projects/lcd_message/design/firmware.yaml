# LCD bus on GP2..GP7 (4-bit: D4-D7, RS, E; RW is tied to GND) and the debug UART.
mcu: U1
signals:
  LCD_RS: { mode: output, initial: low, description: "LCD register select (0 instruction, 1 data)" }
  LCD_E: { mode: output, initial: low, description: "LCD enable: data latched on the falling edge" }
  LCD_D4: { mode: output, initial: low, description: "LCD data bit 4 (4-bit bus, low bit)" }
  LCD_D5: { mode: output, initial: low, description: "LCD data bit 5" }
  LCD_D6: { mode: output, initial: low, description: "LCD data bit 6" }
  LCD_D7: { mode: output, initial: low, description: "LCD data bit 7" }
  UART_TX: { function: UART0_TX, description: debug console out }
  UART_RX: { function: UART0_RX, description: "commands in: msg <text>" }
