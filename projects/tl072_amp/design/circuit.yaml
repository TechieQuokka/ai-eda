description: TL072 (vendor macromodel), gain 1 + RF/RG = 11, 10 kΩ load, ±15 V supplies.
parts:
  VCC: { type: dc_voltage_source, voltage: 15V }
  VEE: { type: dc_voltage_source, voltage: 15V }
  VIN: { type: sine_voltage_source, amplitude: 1V, frequency: 1kHz, ac: 1V }
  # One channel of the dual TL072 in DIP-8 (channel A: pins 1-3; supplies 4 and 8).
  # Channel B is unused: tied off on the board as a follower of GND (mid-supply), so its
  # inputs do not float (TI's advice for unused op-amps); the model has one channel only.
  U1:
    type: tl072
    footprint: Package_DIP:DIP-8_W7.62mm
    pads: { out: 1, in-: 2, in+: 3, v-: 4, v+: 8 }
    board_pads: { "5": GND, "6": UB_OUT, "7": UB_OUT }   # B in+ to GND, B in- to B out
  RF: { type: resistor, resistance: 10kohm }
  RG: { type: resistor, resistance: 1kohm }
  RL: { type: resistor, resistance: 10kohm }
nets:
  VP: [VCC.+, U1.v+]
  VN: [VEE.-, U1.v-]
  IN: [VIN.+, U1.in+]
  FB: [U1.in-, RF.2, RG.1]
  OUT: [U1.out, RF.1, RL.1]
  GND: [VCC.-, VEE.+, VIN.-, RG.2, RL.2]
