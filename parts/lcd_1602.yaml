  kind: hd44780
  columns: 16
  rows: 2
  pins: { vss: vss, vdd: vdd, v0: v0, rs: rs, rw: rw, e: e, d0: d0, d1: d1, d2: d2, d3: d3,
          d4: d4, d5: d5, d6: d6, d7: d7 }
