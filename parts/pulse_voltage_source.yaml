id: pulse_voltage_source
name: Pulse Voltage Source
category: source
description: >
  Trapezoidal pulse between low and high. Before `delay` the output is `low`.
  Current is positive into the + pin.
pins: ["+", "-"]
params:
  low: { unit: V, default: 0V }
  high: { unit: V }
  delay: { unit: s, default: 0s }
  rise: { unit: s, default: 1ns }
  fall: { unit: s, default: 1ns }
  width: { unit: s }
  period: { unit: s }
  ac: { unit: V, default: 0V, description: AC analysis magnitude }
spice:
  prefix: V
  template: >-
    <name> <pin:+> <pin:-> DC <param:low> AC <param:ac>
    PULSE(<param:low> <param:high> <param:delay> <param:rise> <param:fall> <param:width> <param:period>)
symbol:
  cell: v
  ports: { "+": "+", "-": "-" }
  label: "<param:low>/<param:high>"
# On a board, a source is the connector where the supply or signal comes in.
kicad:
  symbol: Simulation_SPICE:VPULSE
pcb:
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical
  pads: { "+": "1", "-": "2" }
