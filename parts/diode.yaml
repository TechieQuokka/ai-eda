id: diode
name: Diode
category: semiconductor
description: Silicon diode with vendor-style SPICE models. Current is positive from anode to cathode.
pins: [anode, cathode]
params:
  model: { choices: [1N4148, 1N4007], default: 1N4148 }
spice:
  prefix: D
  template: "<name> <pin:anode> <pin:cathode> <model>"
  current: "@<name>[id]"
  model_param: model
  models:
    1N4148: "D(IS=2.52n RS=0.568 N=1.752 CJO=4p M=0.4 TT=20n BV=100 IBV=100u)"
    1N4007: "D(IS=7.02767n RS=0.0341512 N=1.80803 EG=1.05743 XTI=5 BV=1000 IBV=0.1 CJO=1e-11 VJ=0.7 M=0.5 FC=0.5 TT=1e-07)"
symbol:
  cell: d_v
  ports: { anode: "+", cathode: "-" }
  label: "<param:model>"
