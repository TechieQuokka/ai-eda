id: diode
name: Diode
category: semiconductor
description: >
  Silicon diode with vendor-style SPICE models: 1N4148 (small signal), 1N4007 (1 A
  rectifier), 1N5817 (1 A, 20 V Schottky, about 0.3 V at 100 mA; its model is fitted to
  the onsemi datasheet's maximum forward voltages, 0.32 V at 0.1 A and 0.45 V at 1 A).
  The default footprint is DO-35; the 1N4007 and 1N5817 come in DO-41
  (`footprint: Diode_THT:D_DO-41_SOD81_P10.16mm_Horizontal`). Current is positive from
  anode to cathode.
pins: [anode, cathode]
params:
  model: { choices: [1N4148, 1N4007, 1N5817], default: 1N4148 }
spice:
  prefix: D
  template: "<name> <pin:anode> <pin:cathode> <model>"
  model_param: model
  models:
    1N4148: "D(IS=2.52n RS=0.568 N=1.752 CJO=4p M=0.4 TT=20n BV=100 IBV=100u)"
    1N4007: "D(IS=7.02767n RS=0.0341512 N=1.80803 EG=1.05743 XTI=5 BV=1000 IBV=0.1 CJO=1e-11 VJ=0.7 M=0.5 FC=0.5 TT=1e-07)"
    1N5817: "D(IS=19.6u RS=0.05 N=1.43 EG=0.69 XTI=2 CJO=110p M=0.35 VJ=0.6 BV=20 IBV=1m)"
symbol:
  cell: d_v
  ports: { anode: "+", cathode: "-" }
  label: "<param:model>"
kicad:
  symbol: Device:D
pcb:
  footprint: Diode_THT:D_DO-35_SOD27_P7.62mm_Horizontal
  pads: { anode: "2", cathode: "1" }
