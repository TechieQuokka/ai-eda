id: dc_voltage_source
name: DC Voltage Source
category: source
description: >
  Ideal DC voltage source; V(+) - V(-) = voltage. Current is positive into the + pin,
  so a source delivering power reads negative.
pins: ["+", "-"]
params:
  voltage: { unit: V }
  ac: { unit: V, default: 0V, description: AC analysis magnitude }
spice:
  prefix: V
  template: "<name> <pin:+> <pin:-> DC <param:voltage> AC <param:ac>"
symbol:
  cell: v
  ports: { "+": "+", "-": "-" }
  label: "<param:voltage>"
# On a board, a source is the connector where the supply or signal comes in.
pcb:
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical
  pads: { "+": "1", "-": "2" }
