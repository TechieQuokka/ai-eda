id: push_button
name: Push Button (normally open)
category: switch
description: >
  6 mm tactile switch. `state` sets it for simulation: open (1 GΩ) or pressed (0.1 Ω).
  Current is positive from pin 1 to pin 2.
pins: ["1", "2"]
params:
  state: { choices: [open, pressed], default: open }
spice:
  prefix: R
  template: "<name> <pin:1> <pin:2> <choice:state>"
  choice_values: { state: { open: "1e9", pressed: "0.1" } }
symbol:
  cell: r_v
  ports: { "1": A, "2": B }
  label: "<param:state>"
pcb:
  footprint: Button_Switch_THT:SW_PUSH_6mm
  pads: { "1": "1", "2": "2" }
