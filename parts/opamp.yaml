id: opamp
name: Generic Op-Amp
category: opamp
description: >
  Generic voltage-feedback op-amp (own macromodel, parts/models/eda_opamp.lib): open-loop
  gain with one dominant pole, slew-rate limit, output swing to the rails minus `swing`,
  input/output resistance, and quiescent supply current. Use a vendor model
  (`eda model import`) when a specific chip matters. Pin currents: current(U1.out) etc.
pins: [in+, in-, v+, v-, out]
params:
  aol: { unit: dB, default: 100dB, positive: true, description: open-loop DC gain }
  gbw: { unit: Hz, default: 1MHz, positive: true, description: gain-bandwidth product }
  slew: { unit: V/s, default: 0.5V/us, positive: true, description: slew rate }
  rin: { unit: ohm, default: 1Tohm, positive: true, description: differential input resistance }
  rout: { unit: ohm, default: 50ohm, positive: true, description: open-loop output resistance }
  iq: { unit: A, default: 1mA, min: 0A, description: quiescent supply current }
  swing: { unit: V, default: 100mV, min: 0V, description: output headroom to each rail }
spice:
  prefix: X
  template: >-
    <name> <pin:in+> <pin:in-> <pin:v+> <pin:v-> <pin:out> eda_opamp
    aol_db=<param:aol> gbw=<param:gbw> sr=<param:slew> rin=<param:rin>
    rout=<param:rout> iq=<param:iq> swing=<param:swing>
  pin_currents: true
  include: models/eda_opamp.lib
symbol:
  cell: op
  ports: { in+: "+", in-: "-", out: OUT, v+: VCC, v-: VEE }
  label: "GBW <param:gbw>"
kicad:
  symbol: Simulation_SPICE:OPAMP
  pins: { in+: "1", in-: "2", v+: "3", v-: "4", out: "5" }
generic: true  # no real chip: set `mpn:` on each instance for the BOM
pcb:
  footprint: Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
  pads: { in-: "2", in+: "3", v-: "4", out: "6", v+: "7" }
  nc: ["1", "5", "8"]  # standard single op-amp pinout: offset null, offset null, NC
